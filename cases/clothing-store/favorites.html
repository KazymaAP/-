  <script>
    const allProducts = [
      { id: 1, name: 'Платье вечернее "Звёзды"', brand: 'Brand Name', price: 4500, oldPrice: 6000, image: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600', rating: 4.8, reviews: 24, colors: ['#000','#fff','#dc2626'], sizes: ['XS','S','M','L','XL'], availableSizes: ['S','M','L','XL'] },
      { id: 2, name: 'Куртка джинсовая "Ретро"', brand: 'Brand Name', price: 7200, image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600', rating: 4.6, reviews: 18, colors: ['#2563EB','#000'], sizes: ['S','M','L','XL'], availableSizes: ['S','M','L'] },
      { id: 6, name: 'Пиджак оверсайз "Классик"', brand: 'Brand Name', price: 8500, oldPrice: 11000, image: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=600', rating: 4.9, reviews: 42, colors: ['#000','#374151'], sizes: ['S','M','L','XL'], availableSizes: ['S','M','L','XL'] }
    ];

    function renderFavorites() {
      const favs = favorites.getAll();
      const grid = document.getElementById('favorites-grid');
      const empty = document.getElementById('favorites-empty');
      if (favs.length === 0) { grid.classList.add('hidden'); empty.classList.remove('hidden'); return; }
      grid.classList.remove('hidden'); empty.classList.add('hidden');
      const favProducts = allProducts.filter(p => favs.includes(p.id));
      grid.innerHTML = favProducts.map(p => {
        const discount = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
        return `<article class="product-card">
          <div class="product-card__image-wrapper">
            <img src="${Utils.sanitizeHTML(p.image)}" alt="${Utils.sanitizeHTML(p.name)}" class="product-card__image" loading="lazy" width="300" height="400">
            ${discount > 0 ? `<div class="product-card__badges"><span class="badge badge--sale">-${discount}%</span></div>` : ''}
            <button class="product-card__favorite" aria-label="Убрать из избранного" aria-pressed="true" data-product-id="${p.id}">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
          </div>
          <div class="product-card__info">
            <p class="product-card__brand">${Utils.sanitizeHTML(p.brand)}</p>
            <h3 class="product-card__title"><a href="product.html?id=${p.id}" class="product-card__link">${Utils.sanitizeHTML(p.name)}</a></h3>
            <div class="product-card__price">
              <span class="product-card__price-current">${Utils.formatPrice(p.price)}</span>
              ${p.oldPrice ? `<span class="product-card__price-old">${Utils.formatPrice(p.oldPrice)}</span>` : ''}
            </div>
            <button class="btn btn--primary btn--full product-card__add-to-cart" data-product-id="${p.id}">В корзину</button>
          </div>
        </article>`;
      }).join('');
    }
    favorites.subscribe(() => renderFavorites());
    renderFavorites();
  </script>
