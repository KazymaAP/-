  <title>Visirki — Конструктор визиток-резюме за 5 минут</title>

  <script type="application/ld+json" nonce="{CSP_NONCE}">
  {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Visirki",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Telegram Mini App",
      "description": "Конструктор визиток-резюме. Создайте цифровую визитку за 5 минут и делитесь ссылкой.",
      "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "RUB",
          "availability": "https://schema.org/InStock"
      },
      "author": {
          "@type": "Person",
          "name": "Nodeforge",
          "url": "https://nodeforge.dev/"
      },
      "featureList": [
          "Создание за 5 минут",
          "Шаблоны для любой ниши",
          "Делитесь в Telegram, WhatsApp, LinkedIn",
          "QR-код для визитки",
          "Адаптивный дизайн"
      ],
      "url": "https://nodeforge.dev/miniapps/visirki/",
      "sameAs": "https://t.me/nodeforge_dev"
  }
  </script>
  
  <script nonce="{CSP_NONCE}">
    // Generate CSP nonce
    (function() {
      const nonce = btoa(crypto.getRandomValues(new Uint8Array(16)).reduce((s, b) => s + String.fromCharCode(b), '')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      document.querySelectorAll('[nonce="{CSP_NONCE}"]').forEach(el => el.nonce = nonce);
      const cspMeta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
      if (cspMeta) {
        cspMeta.content = cspMeta.content.replace('{CSP_NONCE}', nonce);
      }
    })();
  </script>
</head>
<body>
  <a href="#app" class="skip-link">Перейти к основному содержимому</a>
  <noscript>

      <p>Пожалуйста, включите JavaScript в настройках браузера.</p>
    </div>
  </noscript>
  <div id="app" role="main"></div>
  <script src="./app.js" nonce="{CSP_NONCE}"></script>
  <script nonce="{CSP_NONCE}">
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(() => {});
      });
    }
  </script>
</body>
