    <style>
        /* Critical CSS - Inline for fast FCP */
        :root {
            --primary-color: #2AABEE;
            --primary-dark: #229ED9;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F5F5;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-color: #E0E0E0;
        }
        
        [data-theme="dark"] {
            --bg-primary: #1A1A1A;
            --bg-secondary: #2A2A2A;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --border-color: #3A3A3A;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            z-index: 9999;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Prevent flash of unstyled content */
        .product-card,
        .cart-item,
        .order-card {
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
    
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Каталог товаров",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Telegram Mini App",
        "description": "Полноценный каталог товаров с корзиной в Telegram: категории, избранное, заказы, история покупок.",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "RUB",
            "availability": "https://schema.org/InStock"
        },
        "author": {
            "@type": "Person",
            "name": "Nodeforge",
            "url": "https://nodeforge.dev/"
        },
        "featureList": [
            "Каталог с категориями",
            "Корзина и оформление заказов",
            "Избранное товары",
            "История заказов",
            "Поиск и фильтры",
            "Тёмная тема",
            "PWA поддержка"
        ],
        "url": "https://nodeforge.dev/miniapps/catalog/",
        "sameAs": "https://t.me/nodeforge_dev"
    }
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                }
                            });
                        });
                    })
                    .catch(() => {});
            });
        }
    </script>
</head>
<body>
    <!-- Skip link for keyboard navigation -->
    <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>
    
    <div id="app">
        <div class="loading-screen" id="loading" role="status" aria-label="Загрузка приложения">
            <div class="spinner" aria-hidden="true"></div>
        </div>
    </div>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Main App -->
    <script src="./src/app.js"></script>
    
    <!-- Register service worker update handler -->
    <script>
        if ('serviceWorker' in navigator) {
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }
    </script>
</body>
</html>
