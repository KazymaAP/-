<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Nodeforge — Open Graph Image</title>
  <desc id="og-desc">A dark-themed promotional image for Nodeforge, featuring a grid pattern background, geometric logo marks, and the text "Сайты, Telegram-боты и Mini Apps. Быстро и чисто."</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .og-title { font: 700 64px/1 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #F5F7FA; letter-spacing: -0.03em; }
      .og-subtitle { font: 400 24px/1 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #A0A8B8; }
      .og-accent { fill: #7C8EFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="630" fill="#06070A"/>
  <rect x="80" y="80" width="1040" height="470" rx="16" fill="#0B0D12" stroke="#1C2230" stroke-width="1"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="140" y="180" width="80" height="80" rx="12" fill="none" stroke="#CBD3DD" stroke-width="2"/>
  <rect x="240" y="280" width="80" height="80" rx="12" fill="none" stroke="#7C8EFF" stroke-width="2"/>
  <path d="M210 310H175A15 15 0 0 1 160 295v-20" stroke="#556070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M270 240h20A15 15 0 0 1 305 255v20" stroke="#556070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="140" y="440" class="og-title">Nodeforge</text>
  <text x="140" y="490" class="og-subtitle">Сайты, Telegram-боты и Mini Apps. Быстро и чисто.</text>
  <rect x="140" y="520" width="120" height="3" rx="1.5" class="og-accent"/>
